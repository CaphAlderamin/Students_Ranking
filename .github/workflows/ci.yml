name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (phpunit + phpstan)
    runs-on: ubuntu-latest
    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4
      - name: Настроить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Установить зависимости из lock
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit

  schema-docs:
    name: schema-docs (генерация mermaid)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4
      - name: Проверить изменение database/schema.dbml
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            schema:
              - 'database/schema.dbml'
      - name: Настроить Node
        if: steps.filter.outputs.schema == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Сгенерировать docs/schema.mmd
        if: steps.filter.outputs.schema == 'true'
        run: make dbml
      - name: Коммит документации
        if: steps.filter.outputs.schema == 'true'
        run: |
          if git diff --quiet -- docs/schema.mmd; then
            echo "docs/schema.mmd не изменился — коммит не нужен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schema.mmd
          git commit -m "docs: обновить schema.mmd [skip ci]"
          git push