name: students-ranking

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sr-php
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-students_ranking}
      MYSQL_USER: ${MYSQL_USER:-ranking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net
    command: ["tail", "-f", "/dev/null"]

  mysql:
    image: mysql:8.4
    container_name: sr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-students_ranking}
      MYSQL_USER: ${MYSQL_USER:-ranking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - app-net

volumes:
  dbdata:

networks:
  app-net: